<!DOCTYPE html>
<html lang="es">
<head>

  <!-- Configuración básica del documento y adaptación a pantallas móviles. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Título que aparece en la pestaña del navegador. -->
  <title> InfoUNA Amazonas | Sopa de Letras</title>

  <!-- Icono que aparece en la pestaña del navegador. -->
  <link rel="icon" type="image/png" href="Logo-UNA.png">

  <!-- Hoja de estilos principal. Debe estar en la misma carpeta que este archivo. -->
  <link rel="stylesheet" href="Estilos.css">

</head>

<!---------------------------------------------------------------------------------------------------------------->

<body data-game="sopa">
  <!-- SiteLayout.js inserta aquí el encabezado, la navegación y el pie compartidos. -->
  <div id="header"></div>
  <div id="site-nav"></div>

  <!-- Contenido propio de la sopa de letras. -->
  <main class="game-shell pagina-con-encabezado">
    <section class="game-hero encabezado-pagina">
      <div>
        <span class="game-kicker">Juego 01 · Aula interactiva</span>
        <h2>Sopa de letras</h2>
        <p>Encuentra Las Palabras Ocultas</p>
      </div>
    </section>

    <!-- Juegos.js genera en este contenedor el tablero y sus controles. -->
    <div id="app"></div>
  </main>

  <!-- SiteLayout.js inserta aquí el pie de página compartido. -->
  <div id="footer"></div>

  <!-- Mensajes breves para informar acciones del juego. -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Se carga el diseño compartido, los datos del juego y, al final, su lógica. -->
  <script src="SiteLayout.js"></script>
  <script src="Juegos-Data.js"></script>
  <script src="Juegos.js"></script>
</body>
</html>
